<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台湾旅行 Googleマップランチャー</title>
<style>
body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}
header{position:sticky;top:0;background:#163e63;color:white;padding:14px 16px;z-index:9}
header h1{font-size:18px;margin:0 0 4px}header p{font-size:12px;margin:0}
main{max-width:860px;margin:auto;padding:12px}.day h2{color:#163e63}
.area{background:white;border-radius:14px;margin:12px 0;padding:12px;box-shadow:0 2px 8px #0001}
.areahead{display:flex;justify-content:space-between;gap:8px;align-items:center}.areahead h3{margin:0;font-size:16px}
.areabtn,.mapbtn{text-decoration:none;border-radius:9px;font-weight:700}
.areabtn{background:#e8f1fb;color:#135ea8;padding:8px 10px;font-size:12px}
.place{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid #eee}
.name{font-weight:750}.meta{font-size:12px;color:#6b7280;margin-top:2px}.badge{margin-left:6px;padding:2px 7px;border-radius:999px;font-size:10px}
.must{background:#dff2df;color:#246b2c}.cand{background:#fff3c9;color:#795d00}
.mapbtn{background:#1565c0;color:#fff;padding:9px 11px;font-size:12px}
.tip{background:white;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
.error{background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px}
@media(max-width:520px){.place{grid-template-columns:1fr}.mapbtn{text-align:center}.areahead{align-items:flex-start}.areabtn{max-width:42%;text-align:center}}
</style>
</head>
<body>
<header>
<h1>台湾旅行｜Googleマップランチャー</h1>
<p>マストと候補をエリア別に。ボタンでGoogleマップへ。</p>
</header>
<main id="app">
<div class="tip">現地でその日のエリアを開き、マストを軸にしつつ候補店は混雑・営業・腹具合で選べます。</div>
</main>
<script src="data.js"></script>
<script>
function mapsUrl(q){
  if(!/(台北|桃園|Taipei|Taiwan)/.test(q)){ q += " 台北 台湾"; }
  return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q);
}
function esc(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function render(){
  const app=document.getElementById("app");
  if(!window.TRIP_DATA){
    app.insertAdjacentHTML("beforeend",'<div class="error">data.js を読み込めませんでした。</div>');
    return;
  }
  window.TRIP_DATA.forEach(day=>{
    let dayHtml=`<section class="day"><h2>${esc(day.date)}</h2>`;
    day.areas.forEach(area=>{
      dayHtml += `<div class="area"><div class="areahead"><h3>${esc(area.area)}</h3><a class="areabtn" href="${mapsUrl(area.area_query)}">エリアを地図で開く</a></div>`;
      area.places.forEach(p=>{
        const badge=p.status==="マスト" ? "must" : "cand";
        dayHtml += `<div class="place"><div><div class="name">${esc(p.name)}<span class="badge ${badge}">${esc(p.status)}</span></div><div class="meta">${esc(p.category)}</div></div><a class="mapbtn" href="${mapsUrl(p.name)}">Googleマップ</a></div>`;
      });
      dayHtml += `</div>`;
    });
    dayHtml += `</section>`;
    app.insertAdjacentHTML("beforeend",dayHtml);
  });
}
render();
</script>
</body>
</html>
