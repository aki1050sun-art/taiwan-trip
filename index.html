<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>台湾旅行 Googleマップランチャー</title>
<style>
body{margin:0;background:#f3f5f7;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#1f2937}
header{position:sticky;top:0;background:#163e63;color:white;padding:14px 16px;z-index:9}
header h1{font-size:18px;margin:0 0 4px}header p{font-size:12px;margin:0}
main{max-width:980px;margin:auto;padding:12px}.day h2{color:#163e63;margin-bottom:8px}
.area{background:white;border-radius:14px;margin:12px 0;padding:12px;box-shadow:0 2px 8px #0001}
.areahead{display:flex;justify-content:space-between;gap:8px;align-items:center}.areahead h3{margin:0;font-size:16px}
.areabtn,.mapbtn,.taxibtn,.hotelbtn{text-decoration:none;border:0;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit}
.areabtn{background:#e8f1fb;color:#135ea8;padding:8px 10px;font-size:12px}
.place{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid #eee}
.name{font-weight:750}.meta{font-size:12px;color:#6b7280;margin-top:2px}.badge{margin-left:6px;padding:2px 7px;border-radius:999px;font-size:10px}
.must{background:#dff2df;color:#246b2c}.cand{background:#fff3c9;color:#795d00}
.actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.mapbtn{background:#1565c0;color:#fff;padding:9px 11px;font-size:12px}.taxibtn{background:#f59e0b;color:#fff;padding:9px 11px;font-size:12px}
.tip{background:white;border-radius:12px;padding:12px;font-size:13px;line-height:1.6}
.hotelbar{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff7ed;border:1px solid #fed7aa;border-radius:12px;padding:10px 12px;margin:10px 0 4px}.hotelbar strong{font-size:13px}.hotelbtn{background:#ea580c;color:#fff;padding:9px 12px;font-size:12px}
.error{background:#fee2e2;color:#991b1b;border-radius:12px;padding:12px}
.schedule{background:#fff;border-radius:14px;margin:8px 0 16px;box-shadow:0 2px 8px #0001;overflow:hidden}
.schedule summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:800;color:#135ea8;background:#e8f1fb;display:flex;align-items:center;justify-content:space-between}
.schedule summary::-webkit-details-marker{display:none}.schedule summary:after{content:"▼";font-size:11px}.schedule[open] summary:after{content:"▲"}
.schedule-body{padding:10px}.schedule-link{display:block}.schedule-img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid #d7dee8;background:#fff}.schedule-note{font-size:11px;color:#6b7280;margin:7px 2px 0}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:99;padding:16px;align-items:center;justify-content:center}.modal.show{display:flex}.taxicard{background:white;width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px;box-shadow:0 12px 40px #0004}.taxihead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.closebtn{border:0;background:#eef2f7;border-radius:999px;width:36px;height:36px;font-size:20px;cursor:pointer}.label{font-size:12px;color:#6b7280;margin-top:16px}.dest{font-size:28px;font-weight:900;line-height:1.35;margin:6px 0 14px}.zh{font-size:30px;font-weight:900;line-height:1.45;background:#fff7ed;border:2px solid #fdba74;border-radius:14px;padding:14px;margin:6px 0}.jp{font-size:13px;color:#6b7280;margin-top:4px}.taxiactions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.bigbtn{border:0;border-radius:12px;padding:13px 12px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}.speak{background:#16a34a;color:white}.openmap{background:#1565c0;color:white;text-decoration:none;text-align:center}.addressbox{margin-top:12px;padding:10px 12px;border-radius:10px;background:#f8fafc;font-size:13px;line-height:1.55}.taxinote{font-size:12px;color:#6b7280;line-height:1.55;margin-top:12px}
@media(max-width:520px){.place{grid-template-columns:1fr}.actions{justify-content:stretch}.actions a,.actions button{flex:1;text-align:center}.areahead{align-items:flex-start}.areabtn{max-width:42%;text-align:center}main{padding:8px}.schedule-body{padding:6px}.dest{font-size:24px}.zh{font-size:26px}.taxiactions{grid-template-columns:1fr}.hotelbar{align-items:flex-start}}
</style>
</head>
<body>
<header><h1>台湾旅行｜Googleマップランチャー</h1><p>マストと候補をエリア別に。工程表・Googleマップ・タクシー表示を1か所に。</p></header>
<main id="app">
<div class="tip">現地でその日の工程表を確認し、マストを軸にしつつ候補店は混雑・営業・腹具合で選べます。</div>
<div class="hotelbar"><strong>🏨 ホテルへ戻る</strong><button class="hotelbtn" data-taxi="晴美公寓酒店 Jolley Hotel|台北市中山區林森北路568號">🚕 タクシー</button></div>
</main>
<div id="taxiModal" class="modal" aria-hidden="true">
  <div class="taxicard">
    <div class="taxihead"><div><div style="font-weight:900;font-size:18px">🚕 運転手さんに見せる画面</div><div class="jp">この画面をそのまま見せてください</div></div><button class="closebtn" id="closeTaxi">×</button></div>
    <div class="label">目的地</div><div id="taxiDest" class="dest"></div>
    <div id="taxiAddress" class="addressbox" style="display:none"></div>
    <div class="label">台湾で見せる言葉</div><div class="zh">麻煩載我到這裡，謝謝。</div><div class="jp">ここまでお願いします。ありがとうございます。</div>
    <div class="taxiactions"><button id="speakTaxi" class="bigbtn speak">🔊 中国語で読み上げる</button><a id="taxiMap" class="bigbtn openmap" target="_blank" rel="noopener">📍 Googleマップを開く</a></div>
    <div class="taxinote">読み上げはスマホの音声機能を使います。台湾華語の音声が端末にない場合は、画面の文字とGoogleマップを運転手さんに見せれば大丈夫です。</div>
  </div>
</div>
<script src="data.js"></script>
<script>
function mapsUrl(q){if(!/(台北|桃園|Taipei|Taiwan)/.test(q)){q += " 台北 台湾";}return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function openTaxi(payload){
  const parts=String(payload||'').split('|'); const name=parts[0]||''; const address=parts[1]||'';
  document.getElementById('taxiDest').textContent=name;
  const ab=document.getElementById('taxiAddress'); if(address){ab.style.display='block';ab.textContent='地址：'+address;}else{ab.style.display='none';ab.textContent='';}
  document.getElementById('taxiMap').href=mapsUrl(address?name+' '+address:name);
  const m=document.getElementById('taxiModal');m.classList.add('show');m.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closeTaxi(){const m=document.getElementById('taxiModal');m.classList.remove('show');m.setAttribute('aria-hidden','true');document.body.style.overflow='';if(window.speechSynthesis) speechSynthesis.cancel();}
function speakTaxi(){
  if(!('speechSynthesis' in window)){alert('この端末では音声読み上げを利用できません。画面を運転手さんに見せてください。');return;}
  speechSynthesis.cancel();
  const dest=document.getElementById('taxiDest').textContent;
  const text='麻煩載我到這裡，謝謝。目的地是 '+dest+'。';
  const u=new SpeechSynthesisUtterance(text);u.lang='zh-TW';u.rate=0.82;
  const voices=speechSynthesis.getVoices();const v=voices.find(x=>/zh-TW/i.test(x.lang))||voices.find(x=>/^zh/i.test(x.lang));if(v)u.voice=v;
  speechSynthesis.speak(u);
}
function render(){
 const app=document.getElementById('app');
 if(!window.TRIP_DATA){app.insertAdjacentHTML('beforeend','<div class="error">data.js を読み込めませんでした。</div>');return;}
 window.TRIP_DATA.forEach(day=>{
  let dayHtml=`<section class="day"><h2>${esc(day.date)}</h2>`;
  if(day.schedule_image){dayHtml+=`<details class="schedule"><summary>本日の工程表を見る</summary><div class="schedule-body"><a class="schedule-link" href="${esc(day.schedule_image)}" target="_blank" rel="noopener"><img class="schedule-img" src="${esc(day.schedule_image)}" alt="${esc(day.date)} 工程表"></a><div class="schedule-note">画像をタップすると拡大表示できます。</div></div></details>`;}
  day.areas.forEach(area=>{
   dayHtml+=`<div class="area"><div class="areahead"><h3>${esc(area.area)}</h3><a class="areabtn" href="${mapsUrl(area.area_query)}">エリアを地図で開く</a></div>`;
   area.places.forEach(p=>{const badge=p.status==='マスト'?'must':'cand';const taxi=encodeURIComponent(p.name);dayHtml+=`<div class="place"><div><div class="name">${esc(p.name)}<span class="badge ${badge}">${esc(p.status)}</span></div><div class="meta">${esc(p.category)}</div></div><div class="actions"><a class="mapbtn" href="${mapsUrl(p.name)}">Googleマップ</a><button class="taxibtn" data-taxi-enc="${taxi}">🚕 タクシー</button></div></div>`;});
   dayHtml+='</div>';
  });
  dayHtml+='</section>';app.insertAdjacentHTML('beforeend',dayHtml);
 });
}
render();
document.addEventListener('click',e=>{const b=e.target.closest('[data-taxi]');if(b)openTaxi(b.getAttribute('data-taxi'));const b2=e.target.closest('[data-taxi-enc]');if(b2)openTaxi(decodeURIComponent(b2.getAttribute('data-taxi-enc')));});
document.getElementById('closeTaxi').addEventListener('click',closeTaxi);document.getElementById('speakTaxi').addEventListener('click',speakTaxi);document.getElementById('taxiModal').addEventListener('click',e=>{if(e.target.id==='taxiModal')closeTaxi();});
</script>
</body>
</html>
