<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>台湾旅行 Googleマップランチャー</title>
<style>body{margin:0;background:#f3f5f7;color:#163e63;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}#loading{max-width:650px;margin:24px auto;padding:22px;border-radius:14px;background:white;line-height:1.8}a{color:#135ea8}</style>
</head>
<body>
<div id="loading">台湾旅行ランチャーを読み込んでいます…</div>
<script>
(async function(){
 try{
  const response=await fetch('launcher_original.html',{cache:'no-store'});
  if(!response.ok)throw new Error('ランチャーの読み込みに失敗しました');
  let html=await response.text();
  if(!html.includes('taiwan-trip-reviews-v2')||!/<\/body\s*>/i.test(html))throw new Error('ランチャーの形式を確認できません');
  html=html.replace(/<\/body\s*>/i,'<script src="taxi-addresses.js?v=20260920-3"><'+'/script><script src="trip-weather.js?v=20260920-1"><'+'/script><script src="weather-layout-and-umbrella.js?v=20260920-1"><'+'/script><script src="station-info.js?v=20260920-2"><'+'/script><script src="google-translate-shortcut.js?v=20260920-1"><'+'/script><script src="review-export.js?v=20260920-1"><'+'/script><script src="shaved-ice-0921.js?v=20260920-1"><'+'/script></body>');
  document.open();document.write(html);document.close();
 }catch(error){
  console.error('Launcher loading error:',error);
  const box=document.getElementById('loading');
  if(box){box.textContent='読み込みに失敗しました。ページを再読み込みしてください。';const link=document.createElement('a');link.href='launcher_original.html';link.textContent='元のランチャーを開く';box.appendChild(document.createElement('br'));box.appendChild(link)}
 }
})();
</script>
</body>
</html>
