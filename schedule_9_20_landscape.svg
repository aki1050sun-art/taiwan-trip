<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F5F7FA"/><rect width="1600" height="96" fill="#163E63"/><text x="34" y="62" font-family="Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#fff">9/20（日） 善導寺 → 北門・迪化街 → 龍山寺 → 西門</text><rect x="36" y="122" width="1528" height="48" rx="12" fill="#D9EAF7"/><text x="64" y="154" font-family="Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#1F2937">時間</text><text x="284" y="154" font-family="Noto Sans JP, sans-serif" font-size="24" font-weight="700" fill="#1F2937">行程・訪問先</text><rect x="36" y="170" width="1528" height="74" fill="#DDEBF7" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="170" x2="256" y2="244" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="214" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">05:30–06:30</text><text x="280" y="210" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">起床・準備・善導寺へ移動</text><rect x="36" y="244" width="1528" height="74" fill="#E2F0D9" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="244" x2="256" y2="318" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="288" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">06:30–08:00</text><text x="280" y="284" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">★ 阜杭豆漿（豆漿・台湾朝食）｜06:30並び開始</text><rect x="36" y="318" width="1528" height="74" fill="#E7E6E6" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="318" x2="256" y2="392" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="362" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">08:00–11:00</text><text x="280" y="358" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">空き時間｜休憩・周辺散策など自由時間</text><rect x="36" y="392" width="1528" height="74" fill="#E2F0D9" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="392" x2="256" y2="466" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="436" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">11:00–12:30</text><text x="280" y="432" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">★ 古北饕 Goodbeitao（小籠包・台湾料理）</text><rect x="36" y="466" width="1528" height="82" fill="#E2F0D9" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="466" x2="256" y2="548" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="514" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">12:30–15:30</text><text x="280" y="504" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">★ 北門蝦仁飯・煲湯／★ 妙口四神湯 肉包／★ Jade Boat 191</text><text x="280" y="534" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">＋ 迪化街散策・お土産</text><rect x="36" y="548" width="1528" height="74" fill="#E4DFEC" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="548" x2="256" y2="622" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="592" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">15:30–17:00</text><text x="280" y="588" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">★ 龍山寺｜Wang’s Broth／剝皮寮歷史街区／本丸飯糰は候補</text><rect x="36" y="622" width="1528" height="82" fill="#E2F0D9" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="622" x2="256" y2="704" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="670" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">17:00–20:00</text><text x="280" y="660" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">★ 天天利美食坊｜梁山泊小籠湯包／師園鹽酥雞／漢口小籠湯包</text><text x="280" y="690" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">龍都冰果／可蜜達吐司（Comida Toast）など西門周辺</text><rect x="36" y="704" width="1528" height="74" fill="#FFF2CC" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="704" x2="256" y2="778" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="748" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">20:00–21:30</text><text x="280" y="744" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">余裕があれば雙城街夜市・ホテル周辺</text><rect x="36" y="778" width="1528" height="74" fill="#FFF2CC" stroke="#D7DEE8" stroke-width="2"/><line x1="256" y1="778" x2="256" y2="852" stroke="#D7DEE8" stroke-width="2"/><text x="54" y="822" font-family="Noto Sans JP, sans-serif" font-size="22" fill="#1F2937">21:30〜</text><text x="280" y="818" font-family="Noto Sans JP, sans-serif" font-size="21" fill="#1F2937">三葉足体養生館 ※行ければ</text><text x="36" y="880" font-family="Noto Sans JP, sans-serif" font-size="17" fill="#5B6573">緑＝マスト　黄＝候補　青＝移動　紫＝観光　灰＝自由時間　赤＝時間固定・注意</text></svg>